name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint, типы и тесты (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Установить Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Установить зависимости проекта
        run: pip install -e ".[dev]"

      - name: ruff (lint)
        run: ruff check .

      - name: ruff (форматирование)
        run: ruff format --check .

      - name: mypy (типы)
        run: mypy src

      - name: pytest (юнит- и интеграционные тесты)
        run: pytest -v

  docker-build:
    name: сборка Docker-образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать образ (без публикации)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: news-aggregator:ci
