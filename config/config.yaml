# Конфигурация персонального агрегатора новостей.
# Секреты (токены, api_id/api_hash) сюда НЕ помещаются — они берутся из .env.

pipeline:
  dry_run: false              # true = ничего реально не публикуется, только логируется
  poll_interval_seconds: 60
  max_messages_per_source: 100

# Оповещения владельцу в Telegram (через управляющего бота) о сбоях. Секция
# необязательна — без неё действуют значения ниже. Опечатка в имени параметра
# считается ошибкой конфигурации (см. --validate-config).
alerts:
  enabled: true
  source_failure_threshold: 5     # источник упал N прогонов ПОДРЯД -> «не отвечает»
  publish_failure_threshold: 1    # сбоев публикации подряд до оповещения
  flood_wait_alert_seconds: 300   # FloodWait длиннее этого (с) -> оповещение
  cooldown_seconds: 3600          # не чаще раза в час об одной и той же проблеме

sources:
  - "@media1337"
  # Самый простой способ добавить Telegram-канал — просто username строкой.
  # id, kind (telegram_channel) и display_name подставятся автоматически.
  # - "@some_news_channel"
  # - "@another_channel"

  # Если нужно что-то нестандартное (группа, свой id, временно выключить
  # канал не удаляя его) — можно указать словарём, любые поля кроме
  # identifier необязательны:
  # - identifier: "@some_group"
  #   kind: telegram_group
  # - identifier: "@paused_channel"
  #   enabled: false

filters:
  - name: length_filter
    params:
      min_length: 20
  - name: ad_filter
    params:
      keywords:
        - "реклама"
        - "промокод"
        - "подпишись и выиграй"
      # Маркировка рекламы: с 2023 г. любая легальная реклама в РФ несёт токен erid
      # («erid: 2Vtzq...» или «?erid=2Vtzq...»). Надёжнее слов-маркеров. Регулярки
      # ищутся в тексте и в URL гиперссылок. patterns: [] — отключить.
      patterns:
        - '(?<![a-z0-9])erid\s*[:=]?\s*[a-z0-9]{6,}'
  # Пост со ссылкой, в которой есть utm_source=..., считается рекламным и не
  # публикуется. Проверяются и ссылки в тексте, и гиперссылки на словах.
  # ВНИМАНИЕ: utm_source добавляют и многие новостные сайты, такие посты тоже
  # будут отброшены. Причина отсева пишется в лог («рекламная ссылка: ...»).
  - name: utm_filter
    params:
      param_names: ["utm_source", "utm_medium", "utm_campaign"]

deduplicators:
  - name: text_hash_deduplicator
  - name: link_deduplicator
  - name: simhash_deduplicator
    params:
      max_hamming_distance: 4    # 0..64, чем меньше - тем строже совпадение
      lookback_hours: 12         # сравнивать только с сообщениями за последние N часов
      shingle_size: 3            # длина символьных n-грамм для отпечатка
  - name: paraphrase_deduplicator
    params:
      min_jaccard: 0.17          # 0.0..1.0, порог коэффициента Жаккара по леммам
      lookback_hours: 24         # окно сравнения (обычно больше, чем у simhash —
                                 # пересказы разных каналов расходятся по времени сильнее)
      min_lemmas: 4              # короче — сравнение по леммам ненадёжно, пропускается
      stem_length: 5             # леммы усекаются до N символов: «Канада»/«канадцы»,
                                 # «биткоин»/«биткоина». null — без усечения
      min_shared_lemmas: 3       # минимум общих основ (2 слова из 5 — не повод)
      number_veto: true          # числа есть в обоих текстах и не совпадают -> не дубль
      min_overlap: null          # 0.0..1.0 — доп. правило «заголовок против полного
      weighted_min_jaccard: 0.15   # весовой Жаккар (редкие слова весят больше), null — выкл.
      weighted_dry_run: false       # false — отбрасывать дубли сразу (dry-run выключен)
                                 # текста» (доля общих основ меньшего текста); null — выкл.
  - name: embedding_deduplicator  # пересказ по смыслу (модель MiniLM)
    params:
      min_similarity: 0.80       # косинус к посту другого канала за сутки
      dry_run: false              # false — отбрасывать дубли сразу (dry-run выключен)
  - name: image_deduplicator     # та же картинка с другой подписью из другого канала
    params:
      max_distance: 20           # 0..255, расстояние Хэмминга между dHash картинок
      lookback_hours: 24
      min_text_stems: 4          # если в обоих постах столько основ текста —
      min_shared_stems: 2        # …нужно ещё столько общих (стоковое фото != дубль)

enrichers: []

publishers:
  - name: telegram_publisher

storage:
  name: sqlite
  params:
    db_path: "data/state.db"
